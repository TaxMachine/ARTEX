services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    # Built from this checkout. The previous reference was a third-party
    # namespace whose repository is gone: whoever controls that name could
    # publish the tag this file would pull.
    build:
      context: .
      args:
        ARTEX_VERSION: ${ARTEX_VERSION:-dev}
    image: artex:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      ARTEX_JWT_KEY_DIR: /app/keys
      # Optional: key for secrets at rest; empty = keys/secret.key (generated at first start).
      ARTEX_SECRET_KEY: ${ARTEX_SECRET_KEY:-}
      ARTEX_TRUSTED_PROXIES: ${ARTEX_TRUSTED_PROXIES:-}
      # Untrusted-output boundary: on by default (empty = on); ARTEX_UNTRUSTED_BOUNDARY=0 in .env
      # disables it. Cost: about 154 bytes per tool result plus one system note.
      ARTEX_UNTRUSTED_BOUNDARY: ${ARTEX_UNTRUSTED_BOUNDARY:-}
      ARTEX_UPDATE_CHECK: ${ARTEX_UPDATE_CHECK:-}
      # Cross-binary function map (labkit/apps/crossmap) for project graphs.
      ARTEX_CROSSMAP_URL: ${ARTEX_CROSSMAP_URL:-http://172.17.0.1:13060}
      # Noise profile for target requests: off (default) | quiet | balanced | aggressive.
      ARTEX_NOISE_PROFILE: ${ARTEX_NOISE_PROFILE:-}
      ARTEX_TARGET_USER_AGENT: ${ARTEX_TARGET_USER_AGENT:-}
      # Hierarchical run budgets: unset or 0 = unlimited (no change). See README.
      ARTEX_TASK_BUDGET_TOKENS: ${ARTEX_TASK_BUDGET_TOKENS:-}
      ARTEX_TASK_BUDGET_TURNS: ${ARTEX_TASK_BUDGET_TURNS:-}
      ARTEX_INTENT_BUDGET_TOKENS: ${ARTEX_INTENT_BUDGET_TOKENS:-}
      ARTEX_INTENT_BUDGET_TURNS: ${ARTEX_INTENT_BUDGET_TURNS:-}
    # Native machine work needs the libvirt socket (label virt_var_run_t) and the
    # host SSH keys; SELinux container confinement blocks the socket even for
    # root. This disables the container label, matching the deliberate host-level
    # privilege the operator asked for.
    # Give the app time to ACPI-shutdown running VMs before Docker SIGKILLs it.
    stop_grace_period: 120s
    security_opt:
      - label=disable
    # A bind mount alone does not grant the device cgroup permission; `devices`
    # does. Required for script-backed QEMU lab VMs (accel=kvm).
    devices:
      - /dev/kvm:/dev/kvm
    ports:
      - "${ARTEX_BIND_ADDR:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Bind the runtime data directory (traffic index, task files, transcripts, etc.) to data/ in the project root,
      # so it is easy to inspect/back up on the host and survives container rebuilds.
      - ./data:/app/data
      # JWT signing key and secret key (jwt.key, secret.key), kept out of data/, which the file manager browses.
      # Persisting it keeps users signed in across container rebuilds.
      - ./keys:/app/keys
      # Mount skills/ from the project root into the container (overriding the image's built-in /app/skills);
      # skill changes require no image rebuild — the container reads the host copy.
      - ./skills:/app/skills
      # Lab-built skills live in /home/taxmachine/labkit/skills (committed there);
      # ARTEX/skills holds symlinks to them for host-side paths, and these
      # explicit mounts shadow the (container-unresolvable) symlinks with the
      # real directories. Add one line per new lab skill here.
      - /home/taxmachine/labkit/skills/hexbrain:/app/skills/hexbrain
      - /home/taxmachine/labkit/skills/local-hexbrain:/app/skills/local-hexbrain
      - /home/taxmachine/labkit/skills/nuclei-runner:/app/skills/nuclei-runner
      - /home/taxmachine/labkit/skills/semgrep:/app/skills/semgrep
      - /home/taxmachine/labkit/skills/windows-lpe-triage:/app/skills/windows-lpe-triage
      - /home/taxmachine/labkit/skills/windbg:/app/skills/windbg
      - /home/taxmachine/labkit/skills/hypervisor-guest-escape:/app/skills/hypervisor-guest-escape
      - /home/taxmachine/labkit/skills/machine-access:/app/skills/machine-access
      # Native machines (libvirt/SSH/QEMU). The socket is world-rw on this host;
      # /dev/kvm and the image dirs are needed for script-backed lab VMs. SSH keys
      # are read-only. This is deliberate privilege: the operator asked for native
      # VM/SSH control inside ARTEX. Lifecycle tools only address registered machines.
      - /run/libvirt/libvirt-sock:/run/libvirt/libvirt-sock
      - /usr/share/edk2:/usr/share/edk2:ro
      - /home/taxmachine/.ssh:/root/.ssh:ro
      - /var/home/taxmachine/ntvuln:/var/home/taxmachine/ntvuln
      - /var/home/taxmachine/drvwork:/var/home/taxmachine/drvwork
    restart: unless-stopped

volumes:
  pgdata:
